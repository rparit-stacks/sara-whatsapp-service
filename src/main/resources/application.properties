spring.application.name=sara-whatsapp-service
# Local runs read ./.env (KEY=VALUE). In production the same names are real env vars (Doppler).
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8090}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sara_whatsapp}
spring.data.mongodb.database=${MONGODB_DATABASE:sara_whatsapp}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

whatsapp.provider=${WHATSAPP_PROVIDER:META}
whatsapp.default-country-code=${DEFAULT_COUNTRY_CODE:91}
whatsapp.encryption-key=${CONFIG_ENCRYPTION_KEY:}
whatsapp.admin-api-key=${ADMIN_API_KEY:}
whatsapp.opt-out-keywords=${OPT_OUT_KEYWORDS:STOP,STOPALL,UNSUBSCRIBE,OPTOUT}

whatsapp.meta.base-url=https://graph.facebook.com
whatsapp.meta.graph-version=${META_GRAPH_VERSION:v24.0}
whatsapp.meta.waba-id=${META_WABA_ID:}
whatsapp.meta.phone-number-id=${META_PHONE_NUMBER_ID:}
whatsapp.meta.access-token=${META_ACCESS_TOKEN:}
whatsapp.meta.app-secret=${META_APP_SECRET:}
whatsapp.meta.app-id=${META_APP_ID:}
whatsapp.meta.webhook-verify-token=${META_WEBHOOK_VERIFY_TOKEN:}
whatsapp.meta.billing-url=${META_BILLING_URL:https://business.facebook.com/billing_hub/accounts/details?business_id=112722508351752&asset_id=989330084239042&wizard_name=ADD_PM&account_type=whatsapp-business-account}

whatsapp.send.concurrency=8
whatsapp.send.lease-seconds=60
whatsapp.send.max-attempts=5
whatsapp.send.base-backoff-seconds=10
whatsapp.send.max-backoff-seconds=1800

whatsapp.events.max-attempts=8
whatsapp.events.base-backoff-seconds=10
whatsapp.events.max-backoff-seconds=3600

whatsapp.broadcast.daily-limit=${BROADCAST_DAILY_LIMIT:250}
whatsapp.broadcast.chunk-size=200

whatsapp.usage.zone=${USAGE_ZONE:Asia/Kolkata}
whatsapp.usage.gst-percent=${USAGE_GST_PERCENT:18}

# Auto-reply to people who message the number: our template key (blank = off), one reply per sender per cooldown
whatsapp.auto-reply.template-key=${AUTO_REPLY_TEMPLATE_KEY:no_reply_notice_v2}
whatsapp.auto-reply.cooldown-hours=${AUTO_REPLY_COOLDOWN_HOURS:6}

# WhatsApp bot: runs a published flow. It only works while the Marketplace licence (trial or purchase) is live.
whatsapp.bot.enabled=${BOT_ENABLED:true}
whatsapp.bot.backend-url=${BACKEND_BASE_URL:https://studiosara.cloud}
whatsapp.bot.licence-required=${BOT_LICENCE_REQUIRED:true}
whatsapp.bot.daily-message-cap=${BOT_DAILY_MESSAGE_CAP:40}
whatsapp.bot.daily-ai-cap=${BOT_DAILY_AI_CAP:20}
whatsapp.bot.deep-link-base=${BOT_DEEP_LINK_BASE:https://open.studiosara.in}
whatsapp.bot.shared-secret=${BOT_SHARED_SECRET:}
whatsapp.bot.business-start=${BOT_BUSINESS_START:10:00}
whatsapp.bot.business-end=${BOT_BUSINESS_END:19:00}
whatsapp.bot.business-days=${BOT_BUSINESS_DAYS:MON,TUE,WED,THU,FRI,SAT}
